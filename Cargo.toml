[package]
name = "whitespacevalidate"
version = "0.1.0"
edition = "2024"

[lib]
name = "whitespacevalidate"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.28.2"
clap = { version = "4.5.26", features = ["derive"] }
quick-xml = "0.39.2"
glob = "0.3.3"
regex = "1.12.3"
rusqlite = "0.39.0"
serde = {version="1.0.228", features=["derive"]}
bincode = "1.3"
blake3 = "1.8.4"
