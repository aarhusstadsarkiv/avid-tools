name: Build Wheels

on:
  push:
    tags:
      - 'v*.*.*'

env:
  PYTHON_VERSION: 3.11.9
  POETRY_VERSION: 1.8.3

jobs:
  windows:
    name: Build Windows Executable
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: abatilo/actions-poetry@v2
        with:
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Get Tag
        id: tag
        run: echo "tag=$(git tag -l --sort=-version:refname | head -1)" >> "$GITHUB_OUTPUT"
      - name: Install Dependencies
        run: poetry install
      - name: Create Executable
        run: poetry run pyinstaller avid_tools/__main__.py -n avid-tools --collect-all xmlschema --distpath dist --noupx -F
      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avid-tools.exe
          path: dist/avid-tools.exe

  linux:
    name: Build Windows Executable
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: abatilo/actions-poetry@v2
        with:
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Get Tag
        id: tag
        run: echo "tag=$(git tag -l --sort=-version:refname | head -1)" >> "$GITHUB_OUTPUT"
      - name: Install Dependencies
        run: poetry install
      - name: Create Executable
        run: poetry run pyinstaller avid_tools/__main__.py -n avid-tools --collect-all xmlschema --distpath dist --noupx -F
      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avid-tools
          path: dist/avid-tools

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Get Tag
        id: tag
        run: echo "tag=$(git tag -l --sort=-version:refname | head -1)" >> "$GITHUB_OUTPUT"
      - name: Download Executable Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: avid-tools*
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            avid-tools.exe
            avid-tools
